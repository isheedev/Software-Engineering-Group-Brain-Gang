<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — ProjectVault</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-body">

    <nav class="navbar navbar-expand-lg fixed-top navbar-scrolled" id="dash-navbar">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <span class="brand-text">Project<span class="brand-accent">Vault</span></span>
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto align-items-center gap-lg-3">
                    <li class="nav-item">
                        <span class="nav-link user-greeting"><i class="fa-solid fa-shield-halved me-1"></i> Admin</span>
                    </li>
                    <li class="nav-item">
                        <button class="btn btn-outline-light btn-sm nav-btn" id="btn-logout">
                            <i class="fa-solid fa-right-from-bracket me-1"></i> Log Out
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="dashboard-main">
        <div class="container">
            <div class="dash-header">
                <div>
                    <h1 class="dash-title">Admin Panel</h1>
                    <p class="dash-subtitle">Manage every project on ProjectVault</p>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-dark table-borderless align-middle">
                    <thead>
                        <tr>
                            <th>Project</th>
                            <th>Owner</th>
                            <th>Featured</th>
                            <th>Created</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="admin-projects-body"></tbody>
                </table>
            </div>

            <div class="empty-state d-none" id="admin-empty">
                <i class="fa-solid fa-box-open"></i>
                <h3>No projects yet</h3>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
