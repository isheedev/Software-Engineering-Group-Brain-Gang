<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — ProjectVault</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-body">

    <nav class="navbar navbar-expand-lg fixed-top navbar-scrolled" id="dash-navbar">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <span class="brand-text">Project<span class="brand-accent">Vault</span></span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNav">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div class="collapse navbar-collapse" id="adminNav">
                <ul class="navbar-nav ms-auto align-items-center gap-lg-3">
                    <li class="nav-item">
                        <a class="nav-link text-light" href="dashboard.html">
                            <i class="fa-solid fa-grid-2 me-1"></i> My Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link admin-tab-active" href="admin.html">
                            <i class="fa-solid fa-shield-halved me-1"></i> Admin Panel
                        </a>
                    </li>
                    <li class="nav-item">
                        <button class="btn btn-outline-light btn-sm nav-btn" id="btn-logout">
                            <i class="fa-solid fa-right-from-bracket me-1"></i> Log Out
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="dashboard-main">
        <div class="container">
            <div class="dash-header">
                <div>
                    <h1 class="dash-title">Admin Panel</h1>
                    <p class="dash-subtitle">Manage every project on ProjectVault</p>
                </div>
            </div>

            <div class="search-bar">
                <div class="input-group">
                    <span class="input-group-text search-icon"><i class="fa-solid fa-magnifying-glass"></i></span>
                    <input type="text" class="form-control custom-input" id="admin-search" placeholder="Search by project name or owner...">
                </div>
            </div>

            <div class="admin-table-wrap">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Project</th>
                            <th>Owner</th>
                            <th>Featured</th>
                            <th>Created</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="admin-projects-body"></tbody>
                </table>
            </div>

            <div class="empty-state d-none" id="admin-empty">
                <i class="fa-solid fa-box-open"></i>
                <h3>No projects found</h3>
            </div>
        </div>
    </main>

    <!-- Edit Project Modal -->
    <div class="modal fade" id="adminEditModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content glass-modal">
                <div class="modal-header border-0">
                    <h5 class="modal-title">Edit Project</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="adminEditForm">
                        <input type="hidden" id="admin-edit-id">
                        <div class="mb-3">
                            <label class="form-label">Project Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control custom-input" id="admin-edit-name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description <span class="text-danger">*</span></label>
                            <textarea class="form-control custom-input" id="admin-edit-desc" rows="4" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Technologies <span class="text-danger">*</span></label>
                            <input type="text" class="form-control custom-input" id="admin-edit-techs" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">GitHub Link</label>
                            <input type="url" class="form-control custom-input" id="admin-edit-github">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Project Image URL</label>
                            <input type="url" class="form-control custom-input" id="admin-edit-image">
                        </div>
                        <div class="modal-footer border-0 px-0">
                            <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-gradient">
                                <i class="fa-solid fa-floppy-disk me-2"></i> Save Changes
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
